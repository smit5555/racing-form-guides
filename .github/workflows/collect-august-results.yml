name: Collect August results
on:
  workflow_dispatch:
    inputs:
      batch:
        description: August 2026 dates to collect
        type: choice
        required: true
        options:
          - 01-10
          - 11-20
          - 21-31
      mode:
        description: Start with a one-meeting pilot
        type: choice
        required: true
        default: pilot
        options:
          - pilot
          - batch
permissions:
  contents: read
concurrency:
  group: august-results-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check collector
        run: python -m unittest discover -s collection_tests -v
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect selected dates
        timeout-minutes: 275
        env:
          AUGUST_BATCH: ${{ inputs.batch }}
          COLLECTION_MODE: ${{ inputs.mode }}
        run: |
          if [ "$COLLECTION_MODE" = pilot ]; then
            python tools/collect_august_results.py --batch "$AUGUST_BATCH" --pilot --output august-results
          else
            python tools/collect_august_results.py --batch "$AUGUST_BATCH" --output august-results
          fi
      - name: Save complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: august-2026-results-${{ inputs.mode }}-${{ inputs.batch }}-${{ github.run_id }}
          path: august-results/
          if-no-files-found: warn
          retention-days: 7
