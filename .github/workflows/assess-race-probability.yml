name: Assess saved guides with frozen probability model
on:
  workflow_dispatch:
    inputs:
      guide_run_id:
        description: Saved form-guide download run number
        required: true
        type: string
      training_run_id:
        description: Frozen model training run number (do not retrain)
        default: '39587783887'
        required: true
        type: string
      start_date:
        description: First guide date YYYY-MM-DD
        required: true
        type: string
      end_date:
        description: Last guide date YYYY-MM-DD (inclusive, maximum 31 days)
        required: true
        type: string
      fetch_results:
        description: After publishing prediction locks, fetch official results for research evaluation
        default: false
        required: true
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: racing-form-downloads
  cancel-in-progress: false
jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r race_model/requirements.txt
      - name: Check frozen inference, locks and blocked-result stopping offline
        run: python -m unittest race_model.test_model race_model.test_assessment -q
      - name: Read saved form guides (including an incomplete run's preserved files)
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.guide_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: '*form-guides-${{ inputs.guide_run_id }}'
          merge-multiple: true
          path: ${{ runner.temp }}/probability-guides
      - name: Read the already frozen training model
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.training_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: race-probability-development-${{ inputs.training_run_id }}
          path: ${{ runner.temp }}/probability-model
      - name: Predict and lock all eligible fields without accessing outcomes
        env:
          GUIDE_RUN_ID: ${{ inputs.guide_run_id }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          GUIDES: ${{ runner.temp }}/probability-guides
          MODEL: ${{ runner.temp }}/probability-model
        run: python -m race_model.assess --guides "$GUIDES" --model-folder "$MODEL" --start-date "$START_DATE" --end-date "$END_DATE" --output probability-predictions
      - name: Publish predictions before results are allowed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-probability-predictions-${{ github.run_id }}
          path: probability-predictions/
          retention-days: 90
          if-no-files-found: warn
  results:
    needs: assess
    if: ${{ inputs.fetch_results }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r race_model/requirements.txt
      - name: Load the published prediction lock from this run
        uses: actions/download-artifact@v5
        with:
          name: race-probability-predictions-${{ github.run_id }}
          path: ${{ runner.temp }}/published-probability-predictions
      - name: Fetch official results sequentially and evaluate fixed predictions
        env:
          LOCK: ${{ runner.temp }}/published-probability-predictions/probability-lock
        run: python -m race_model.settle --locked-folder "$LOCK" --output probability-results
      - name: Preserve results, source pages and unresolved cases even after a block
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-probability-results-${{ github.run_id }}
          path: probability-results/
          retention-days: 90
          if-no-files-found: warn
