name: Download a date range of form guides
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First date (YYYY-MM-DD, inclusive)
        required: true
        default: '2026-08-15'
        type: string
      end_date:
        description: Last date (YYYY-MM-DD, inclusive)
        required: true
        default: '2026-08-17'
        type: string
      states:
        description: States (comma separated)
        default: QLD,NSW,VIC,SA,WA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: racing-form-downloads
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download date range sequentially
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          STATES: ${{ inputs.states }}
        run: python download_month.py --start-date "$START_DATE" --end-date "$END_DATE" --states "$STATES"
      - name: Save daily guides and monthly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-form-guides-${{ github.run_id }}
          path: outputs/
          retention-days: 14
          if-no-files-found: warn
